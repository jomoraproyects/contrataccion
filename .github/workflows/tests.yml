name: Pruebas

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: seleccion_test
          MYSQL_USER: seleccion
          MYSQL_PASSWORD: test-no-produccion
          MYSQL_ROOT_PASSWORD: root-no-produccion
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -proot-no-produccion"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: clave-exclusiva-para-pruebas-automatizadas
      DEBUG: "True"
      DATABASE_URL: mysql://seleccion:test-no-produccion@127.0.0.1:3306/seleccion_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py check --deploy
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: seleccion.example.com
          CSRF_TRUSTED_ORIGINS: https://seleccion.example.com
      - run: python manage.py test
      - run: python manage.py collectstatic --noinput
