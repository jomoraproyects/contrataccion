name: Pruebas

on:
  push:
  pull_request:

jobs:
  django:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: seleccion_test
          POSTGRES_USER: seleccion
          POSTGRES_PASSWORD: test-no-produccion
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seleccion -d seleccion_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      SECRET_KEY: clave-exclusiva-para-pruebas-automatizadas
      DEBUG: "True"
      DATABASE_URL: postgresql://seleccion:test-no-produccion@127.0.0.1:5432/seleccion_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py check --deploy
        env:
          DEBUG: "False"
          ALLOWED_HOSTS: seleccion.example.com
          CSRF_TRUSTED_ORIGINS: https://seleccion.example.com
      - run: python manage.py test
      - run: python manage.py collectstatic --noinput
